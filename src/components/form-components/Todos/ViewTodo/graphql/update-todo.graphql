mutation UpdateTask($data: TodoUpdateInput!, $where: UniqueId!) {
  updateTodo(data: $data, where: $where) {
    id
    name
    description
    dueDate
    completed
    authorised
    completedDate
    createdAt
    assignedUsers {
      id
      fullName
    }

    evidence {
      id
      name
      url
      fileType
    }
  }
}
