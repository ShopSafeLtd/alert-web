mutation UpdateTodoDetails($data: TodoUpdateInput!, $where: UniqueId!) {
  updateTodo(data: $data, where: $where) {
    id
    name
    description
    dueDate
    completed
    authorised
    assignedUsers {
      id
      fullName
    }

    business {
      id
    }
    groups {
      id
      name
    }
    evidence {
      id
      name
      url
      fileType
    }
    incident {
      id
      reference
      subject
    }
    offender {
      id
      name
    }
    investigation {
      id
      name
    }
    crimeGroup {
      id
      alias
      reference
    }
    checklist {
      id
      name
    }
  }
}
