query LinkInvestigations(
  $where: investigationRelayWhereInput!
  $take: Int
  $skip: Int
  $orderBy: investigationRelayOrderInput
) {
  investigationRelay(
    where: $where
    take: $take
    skip: $skip
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      node {
        id
        name
        status
        createdAt
        reference
      }
    }
  }
}
