query usersSelect(
    $where: UserWhereInput
    $orderBy: [UserOrderByWithRelationInput!]
    $take: Int
    $skip: Int
    $schemesWhere: UserSchemeWhereInput
) {
    listUsers(where: $where, orderBy: $orderBy, take: $take, skip: $skip) {
        users {
            id
            fullName
            schemes(where: $schemesWhere) {
                id
                role
            }
        }
        total
    }
}
