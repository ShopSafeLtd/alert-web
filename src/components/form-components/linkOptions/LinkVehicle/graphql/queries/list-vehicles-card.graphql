query ListVehiclesCard(
  $take: Int
  $skip: Int
  $where: VehicleWhereInput
  $order: VehicleOrderByWithRelationInput
) {
  listVehicles(take: $take, skip: $skip, where: $where, order: $order) {
    vehicles {
      id
      reference
      colour
      model
      make
      registration
      images {
        id
        optimised
        url
        position
        rotation
      }
    }
    total
  }
}
