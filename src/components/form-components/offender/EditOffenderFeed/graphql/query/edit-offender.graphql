query EditOffender($where: OffenderWhereUniqueInput!) {
  offender(where: $where) {
    id
    alias
    infoSource
    knownFor
    targetedGoods
    justification
    age
    build
    height
    dateOfBirth
    dateSource
    hair
    gender
    comment
    name
    reference
    race
    peculiarities
    approved
    idVerified
    totalIncidents
    idSource
    sourceDetails
    customGalleries {
      id
      name
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
  }
}
