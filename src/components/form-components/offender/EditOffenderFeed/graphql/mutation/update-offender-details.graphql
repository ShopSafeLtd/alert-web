mutation UpdateOffenderDetails($data: OffenderUpdateDetailsInput!, $where: String!) {
  updateOffenderDetails(data: $data, where: $where) {
    age
    alias
    build
    comment
    customGalleries {
      id
      name
    }
    dateOfBirth
    dateSource
    gender
    groups {
      id
      name
    }
    hair
    height
    idSource
    idVerified
    infoSource
    justification
    name
    peculiarities
    race
    tags {
      id
      name
    }
  }
}
