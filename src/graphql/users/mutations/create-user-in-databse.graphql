mutation createUserInDatabase(
  $data: CreateUserData!
  $groupWhere: GroupWhereInput
) {
  createUserInDatabase(data: $data) {
    id
    fullName
    firstLetter
    origName
    origFirstLetter
    email
    publicName
    reportToAllBusinesses
    businesses {
      id
      name
      fullName
    }
    status
    groups(where: $groupWhere) {
      id
      name
    }
    approverGroups {
      id
      name
    }
    loginEvents {
      loginTime
    }
  }
}
