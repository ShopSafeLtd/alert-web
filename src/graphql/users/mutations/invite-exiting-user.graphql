mutation inviteExistingUser($data: UserUpdateInput!, $where: UniqueId!, $groupWhere: GroupWhereInput) {
  inviteExistingUser(data: $data, where: $where) {
    id
    fullName
    email
    businesses {
      id
      name
    }
    status
    groups(where: $groupWhere) {
      id
      name
    }
  }
}
