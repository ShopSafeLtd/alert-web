query ListSchemeUsers(
  $where: UserWhereInput,
  $orderBy: [UserOrderByWithRelationInput!],
  $after: UserWhereUniqueInput,
  $groupWhere: GroupWhereInput
) {
  users(where: $where, orderBy: $orderBy, after: $after) {
    id
    fullName
    email
    organisation
    status
    groups(where: $groupWhere) {
      id
      name
    }
  }
}