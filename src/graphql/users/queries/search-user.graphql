query SearchUser($where: UserWhereUniqueInput!) {
  user(where: $where) {
    id
    fullName
    businesses {
      id
      name
      locations {
        id
        full
      }
    }
    email
    publicName
    addresses(where: { primary: { equals: true } }) {
      id
      postcode
      street
      townCity
      building
      county
    }
  }
}
