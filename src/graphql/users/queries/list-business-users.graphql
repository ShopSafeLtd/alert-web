query ListBusinessUsers(
  $where: UserWhereInput
  $orderBy: [UserOrderByWithRelationInput!]
  $groupWhere: GroupWhereInput
  $SessionWhereInput: SessionWhereInput
) {
  users(where: $where, orderBy: $orderBy) {
    id
    fullName
    status
    publicName
    sessions(take: 1, orderBy: { createdAt: desc }, where: $SessionWhereInput) {
      createdAt
    }
    groups(where: $groupWhere) {
      id
      name
    }
  }
}
