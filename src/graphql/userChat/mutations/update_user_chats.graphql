mutation updateUserChat($where: UniqueId!, $data: UserUpdateInput!) {
  updateUser(where: $where, data: $data) {
    id
    chats {
      id
      newMessages
      mentioned
      updatedAt
      createdAt
      user {
        id
        fullName
        firstLetter
      }
      chat {
        id
        name
        firstLetter
        totalMembers
        messages {
          id
          content
          createdAt
          from {
            id
            fullName
          }
          images {
            id
            url
            optimised
          }
          incidents {
            id
            subject
          }
          offenders {
            id
            name
          }
        }
      }
    }
  }
}
