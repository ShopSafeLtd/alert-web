query userChats(
  $where: UserWhereUniqueInput!
  $orderBy: [UserChatOrderByWithRelationInput!]
  $scheme: String!
) {
  user(where: $where) {
    id
    chats(
      where: { chat: { scheme: { id: { equals: $scheme } } } }
      orderBy: $orderBy
    ) {
      id
      newMessages
      mentioned
      updatedAt
      createdAt
      user {
        id
        fullName
        firstLetter
      }
      chat {
        id
        name
        firstLetter
        totalMembers
        messages {
          id
          content
          createdAt
          from {
            id
            fullName
          }
          images {
            id
            url
            optimised
          }
          incidents {
            id
            subject
          }
          offenders {
            id
            name
          }
        }
      }
    }
  }
}
