mutation createChat($data: ChatCreateInput!) {
  createChat(data: $data) {
    id
    name
    description
    members {
      id
      newMessages
      updatedAt
      createdAt
      user {
        id
        fullName
        firstLetter
        organisation
      }
      chat {
        id
        name
        firstLetter
        messages {
          id
          content
          createdAt
          from {
            id
            fullName
          }
          images {
            id
            url
            optimised
          }
          incidents {
            id
            subject
          }
          offenders {
            id
            name
          }
        }
      }
    }
  }
}
