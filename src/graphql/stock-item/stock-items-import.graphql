query ListStockItems($where: StockItemsWhereInput, $take: Int) {
  listStockItems(where: $where, take: $take) {
    total
    stockItems {
      id
      barcode
      brand
      costPriceLocal
      costPriceStandard
      division
      name
      salesPriceLocal
      salesPriceStandard
      sku
    }
  }
}
