fragment OffenderCard on Offender {
  id
  name
  totalIncidents
  reference
  totalImages
  approved
  knownFor
  targetedGoods
  totalValue
  comment
  createdByUser
  latestIncident {
    id
    dateAgo
    reportedBusinessName
  }
  tags {
    id
    name
  }
  images {
    id
    rotation
    position
    optimised
    primary
    policeImage
  }
}
