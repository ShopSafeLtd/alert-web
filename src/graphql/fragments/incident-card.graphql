fragment IncidentCard on Incident {
  approved
  id
  totalImages
  crimeTypes {
    id
    name
  }
  priority
  customerRef
  newIncident
  status {
    id
    name
    tooltip
  }
  assignedUsers {
    id
    fullName
  }
  images {
    low
    optimised
    id
    rotation
    position
    positionX
    positionY
    primary
  }
  subject
  reference
  policeRef
  offenders {
    name
    id
    images(take: 1, orderBy: { createdAt: desc }) {
      id
      low
      optimised
      rotation
      position
      positionX
      positionY
    }
  }
  dayTime
  business {
    name
  }
  location {
    full
  }
  description
  createdByUser
}
