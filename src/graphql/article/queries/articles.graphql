query Articles(
  $where: ArticleWhereInput
  $orderBy: [ArticleOrderByWithRelationInput!]
) {
  articles(where: $where, orderBy: $orderBy) {
    previewImage
    previewText
    priority
    tags {
      id
      name
    }
    images {
      id
      url
      optimised
      card
    }
    image {
      id
      url
      optimised
      card
    }
    createdBy {
      fullName
      businesses {
        id
        name
      }
      id
    }
    title
    updatedAt
    id
  }
}
