query listArticles(
  $scheme: SchemeWhereUniqueInput!
  $where: ArticleWhereInput
  $take: Int
  $skip: Int
  $order: ArticleOrderByWithRelationInput
) {
  listArticles(
    where: $where
    order: $order
    take: $take
    skip: $skip

    scheme: $scheme
  ) {
    articles {
      previewImage
      previewText
      priority
      tags {
        id
        name
      }
      images {
        id
        url
        optimised
        card
        position
        rotation
      }
      image {
        id
        url
        optimised
        card
      }
      createdBy {
        fullName
        businesses {
          id
          name
        }
        id
      }
      groups {
        id
        name
      }
      title
      updatedAt
      id
    }
    total
  }
}
