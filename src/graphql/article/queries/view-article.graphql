query Article($where: ArticleWhereUniqueInput!) {
  article(where: $where) {
    id
    watermarkImage
    groups {
      id
      name
      scheme {
        id
        name
      }
    }
    business {
      id
      name
    }
    roles {
      id
      name
    }
    documents {
      id
      name
      url
    }
    createdBy {
      fullName
    }
    createdAt
    updatedAt
    priority
    criticalExpiry
    completedAt
    status
    tags {
      name
      id
    }
    schemes {
      id
      name
    }
    images {
      id
      url
      optimised
      card
      position
      rotation
    }
    image {
      id
      url
      optimised
      card
    }
    title
    rows {
      columns {
        text
        incidents {
          ...IncidentCard
        }
        offenders {
          ...OffenderCard
          age
          gender
          race
          build
          dateOfBirth
          alias
          targetedBusinesses {
            id
            name
          }
          latestIncident {
            id
            date
            dayTime
          }
          lastActive {
            id
            dayTime
          }
        }
      }
    }
  }
}
