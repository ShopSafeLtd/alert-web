mutation EditArticle($data: CreateArticleInput!, $where: UniqueId!) {
  editArticle(data: $data, where: $where) {
    id
    groups {
      id
      name
    }

    documents {
      id
      name
      url
    }
    createdBy {
      fullName
    }
    createdAt
    priority
    tags {
      name
    }
    title
    images {
      id
      url
      optimised
      card
      position
    }
    image {
      id
      url
      optimised
      card
    }
    rows {
      columns {
        text
        incidents {
          id
          subject
          description
          dayTime
          reference
          policeRef
          crimeTypes {
            id
            name
          }
          approved
          uploaded
          location {
            id
            full
          }
          createdBy {
            id
            fullName
            businesses {
              fullName
              id
              name
            }
          }
          images {
            id
            url
            position
            optimised
            card
            offenders {
              id
            }
          }
          groups {
            id
            name
          }
          offenders {
            id
            name
          }
        }
offenders {
          ...OffenderCard
        }
      }
    }
  }
}
