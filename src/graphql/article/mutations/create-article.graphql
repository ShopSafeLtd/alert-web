mutation CreateArticle($data: CreateArticleInput!) {
  createArticle(data: $data) {
    id
    groups {
      id
      name
    }

    documents {
      id
      name
      url
    }
    createdBy {
      fullName
    }
    createdAt
    priority
    tags {
      name
    }
    title
    images {
      id
      url
      optimised
      card
      position
    }
    image {
      id
      url
      optimised
      card
    }
    rows {
      columns {
        text
        incidents {
          ...IncidentCard
        }
        offenders {
          ...OffenderCard
        }
      }
    }
  }
}
