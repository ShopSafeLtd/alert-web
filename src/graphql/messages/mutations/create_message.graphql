mutation createMessage($data: MessageCreateWithoutActionsInput!) {
  createMessage(data: $data) {
    id
    content
    createdAt
    currentUser
    formattedDateTime
    from {
      id
      fullName
      firstLetter
      origFirstLetter
      origName
      businesses {
        id
        fullName
      }
    }
    sent
    showUser
    paddingTop
    type
    images {
      id
      url
      optimised
      position
    }
    crimeGroups {
      totalOffenders
      totalIncidents
      alias
      id
      reference
    }
    vehicles {
      registration
      reference
      model
      make
      id
      colour
      images {
        id
        optimised
        url
        position
      }
    }
    incidents {
      id
      subject
      description
      dayTime
      images {
        id
        url
        optimised
        position
      }
    }
    offenders {
      id
      updatedAt
      age
      build
      height
      dateOfBirth
      name
      race
      gender
      images {
        id
        url
        optimised
        position
      }
    }
  }
}
