subscription MessagesSubscription($chat: ID!, $user: ID!) {
  chatMessages(chatId: $chat, userId: $user) {
    id
    content
    createdAt
    currentUser
    formattedDateTime
    from {
      id
      fullName
      firstLetter
    }
    sent
    showUser
    paddingTop
    type
    images {
      id
      url
      optimised
      position
    }
    crimeGroups {
      totalOffenders
      totalIncidents
      alias
      id
      reference
      totalRecoveredValue
      totalTheftSuccess
      totalValue
      updatedAt
    }
    vehicles {
      updatedAt
      totalOffenders
      registration
      reference
      model
      make
      id
      colour
      images {
        id
        optimised
        url
        position
      }
    }
    incidents {
      id
      subject
      description
      dayTime
      images {
        id
        url
        optimised
        position
      }
    }
    offenders {
      id
      updatedAt
      age
      build
      height
      dateOfBirth
      name
      race
      gender
      images {
        id
        url
        optimised
        position
      }
    }
  }
}
