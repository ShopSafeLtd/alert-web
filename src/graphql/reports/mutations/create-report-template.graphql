mutation CreateReportTemplate($data: ReportTemplateCreateInput!) {
    createReportTemplate(data: $data) {
        ...ReportTemplates
        reportGroup {
            id
        }
    }
}

fragment ReportTemplates on ReportTemplate {
    id
    metaData
    default
    description
    layout {
        id
        createdAt
        updatedAt
        h
        w
        x
        y
        maxW
        maxH
        minW
        minH
        static
        moved
        i
    }
    name
    type
}
