query BusinessEngagement(
  $where: UserContributionWhereInput!
  $skip: Int
  $take: Int
  $orderBy: BusinessContributionOrderByInput
) {
  businessContribution(
    where: $where
    skip: $skip
    take: $take
    orderBy: $orderBy
  ) {
    businessContributions {
      name
      totalUsers
      totalIncidents
      totalOffenders
      totalUpdates
      totalMessages
      totalLogins
    }
    total
  }

}