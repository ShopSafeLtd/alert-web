query PerformanceReport(
  $where: UserContributionWhereInput!
  $businessContributionSkip: Int
  $businessContributionTake: Int
  $businessContributionOrderBy: BusinessContributionOrderByInput
) {
  performanceReport(where: $where) {
    createdDataCounts {
      crimeGroups
      incidents
      messages
      offenders
      updates
      vehicles
      bulletins
    }
    incidentSummary {
      totalIncidents
      lastIncidentDate
      incidentsReportedToPolice
      incidentsWherePoliceAttended
      mostCommonCrimeType
    }
    outcomeSummary {
      totalArrests
      totalCBOYears
      totalCBOCount
      totalFinesCount
      totalFinesValue
      totalPrisonSentenceCount
      totalPrisonSentenceMonths
      totalRehabOrders
    }
    crimeTypeDonut {
      label
      value
    }
    involvedTagCountDonut {
      label
      value
    }
    incidentDayOfWeekLine {
      label
      value
    }
    lossTotals {
      totalIncidents
      totalLostValue
      totalRecoveredValue
      averagePerIncident
      averageSuccessRate
      averageLossPerIncident
    }
    goodsTypeCountDonut {
      label
      value
    }
    goodsTypeValueDonut {
      label
      value
    }
    policeSummary {
      totalAttendedIncidents
      totalReportedIncidents
      totalPoliceImages
      totalVerifiedOffenders
    }
    investigationSummary {
      closed
      open
      opened
    }
    timeHeatMap {
      id
      data {
        x
        y
      }
    }
    priorityGraph {
      value
      label
    }
  }
  offendersPerformance(where: $where) {
    total
    offenderPerformance {
      primaryPhoto
      alertId
      name
      totalIncidents
      totalLostValue
      totalRecoveredValue
      totalSuccessRate
      lastIncidentDate
      id
      totalBulletins
    }
  }
  businessContribution(
    where: $where
    skip: $businessContributionSkip
    take: $businessContributionTake
    orderBy: $businessContributionOrderBy
  ) {
    businessContributions {
      name
      totalUsers
      totalIncidents
      totalOffenders
      totalUpdates
      totalMessages
      totalLogins
      totalSuccessRate
      totalRecoveredValue
      totalLostValue
      mostCommonGoodLost
      highestTotalValueGoodLost
      averageLossValue
    }
    total
  }
  crimeGroupPerformance(where: $where) {
    crimeGroupPerformance {
      totalSuccessRate
      totalRecoveredValue
      totalOffenders
      totalLostValue
      totalIncidents
      lastIncident
      alias
      alertId
    }
    total
  }
  targetedGoods(where: $where) {
    targetedGoods {
      alertId
      name
      totalIncidents
      totalOffenders
      totalLostValue
      totalRecoveredValue
      totalSuccessRate
      averageLossValue
    }
    total
  }
  incidentHeatPerformance(where: $where) {
    total
    incidents {
      id
      location {
        id
        geoLat
        geoLng
      }
    }
  }
  investigationPerformance(where: $where) {
    total
    investigationPerformance {
      id
      alertId
      name
      status
      totalIncidents
      totalOffenders
      totalValue
      createdAt
      closedAt
    }
  }
}