query UserEngagement(
  $where: UserContributionWhereInput!
  $skip: Int
  $take: Int
  $orderBy: UserContributionOrderByInput
) {
  userContributions(
    where: $where
    skip: $skip
    take: $take
    orderBy: $orderBy
  ) {
    total
    userContributions {
      name
      businesses
      totalIncidents
      totalOffenders
      totalUpdates
      totalMessages
      totalLogins
      lastLogin
      groups
    }
  }
}
