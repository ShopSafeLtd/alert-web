query OffenderProfile($where: OffenderWhereUniqueInput!, $orderBy: [BanOrderByWithRelationInput!], $first: Int, $incidentsOrderBy: [IncidentOrderByWithRelationInput!]) {
  offender(where: $where) {
    age
    bans(orderBy: $orderBy) {
      id
      endDate
      active
      startDate
      title
    }
    crimeGroups {
      id
      reference
    }
    dateOfBirth
    dateSource
    gender
    hair
    build
    id
    incidentTotals {
      months
      data {
        name
        count
      }
    }
    images(first: $first) {
      id
      optimised
    }
    incidents(orderBy: $incidentsOrderBy) {
      id
      dayTime
      date
      crimeTypes {
        id
        name
      }
      value
      recoveredValue
      reference
      createdBy {
        id
        organisation
      }
    }
    lastActive {
      id
      dayTime
      date
      crimeTypes {
        id
        name
      }
      createdBy {
        id
        organisation
      }
      value
      recoveredValue
      reference
    }
    name
    peculiarities
    race
    reference
    tags {
      id
      name
    }
    totalIncidents
    totalRecoveredValue
    totalTheftSuccess
    totalValue
    updatedAt
    vehicles {
      id
      make
      model
      registration
      colour
    }
  }
}