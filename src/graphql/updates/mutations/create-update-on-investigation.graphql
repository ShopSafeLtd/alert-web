mutation CreateUpdateOnInvestigation(
  $investigation: UniqueId!
  $data: CreateUpdateData!
) {
  createUpdateOnInvestigation(investigation: $investigation, data: $data) {
    id
    text
    type
    createdAt
    images {
      id
      url
      optimised
      card
    }
    linkedIncidents {
      id
      subject
      description
      dayTime
      images {
        id
        url
        optimised
      }
    }
    linkedOffenders {
      id
      updatedAt
      age
      build
      dateOfBirth
      name
      race
      gender
      images {
        id
        url
        optimised
      }
    }
    linkedCrimeGroups {
      totalOffenders
      totalIncidents
      alias
      id
      reference
      totalRecoveredValue
      totalTheftSuccess
      totalValue
      updatedAt
    }
    linkedVehicles {
      updatedAt
      totalOffenders
      registration
      reference
      model
      make
      id
      colour
    }
    createdBy {
      id
      fullName
      businesses {
        id
        name
      }
    }
    replies {
      id
      text
      type
      createdAt
      images {
        id
        url
        optimised
        card
      }
      linkedCrimeGroups {
        totalOffenders
        totalIncidents
        alias
        id
        reference
        totalRecoveredValue
        totalTheftSuccess
        totalValue
        updatedAt
      }
      linkedVehicles {
        updatedAt
        totalOffenders
        registration
        reference
        model
        make
        id
        colour
      }
      linkedIncidents {
        id
        subject
        description
        dayTime
        images {
          id
          url
          optimised
        }
      }
      linkedOffenders {
        id
        updatedAt
        age
        build
        dateOfBirth
        name
        race
        gender
        images {
          id
          url
          optimised
        }
      }
      createdBy {
        id
        fullName
        businesses {
          id
          name
        }
      }
    }
  }
}
