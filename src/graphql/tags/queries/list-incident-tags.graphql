query ListIncidentTags($where: IncidentTagsInput!) {
  listIncidentTags(where: $where) {
    hasChildren
    incidentForm {
      position
      type
    }
    label
    parentId
    parents
    policeReporting
    questions {
      answerType
      label
      questionId
      required
      tagQuestionId
      priority
      dependentOnQuestionId
      dependentOnAnswerValue
      dependentOnBrandIds
      tooltip
      options {
        label
        value
      }
    }
    tier
    value
    tooltip
  }
}
