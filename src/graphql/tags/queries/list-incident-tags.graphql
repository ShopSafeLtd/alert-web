query ListIncidentTags($where: IncidentTagsInput!) {
    listIncidentTags(where: $where) {
        hasChildren
        incidentForm {
            position
            type
        }
        label
        parentId
        parents
        questions {
            answerType
            label
            questionId
            required
            tagQuestionId
        }
        tier
        value
        tooltip
    }
}