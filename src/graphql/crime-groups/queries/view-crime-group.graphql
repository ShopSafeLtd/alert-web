query CrimeGroup($where: CrimeGroupWhereUniqueInput!) {
  crimeGroup(where: $where) {
    id
    reference
    totalIncidents
    totalOffenders
    totalRecoveredValue
    totalTheftSuccess
    totalValue
    subscribed
    alias
    offenders {
      id
      name
      reference
      lastActive {
        id
        dayTime
      }
      hair
      peculiarities
      race
      dateOfBirth
      dateSource
      build
      age
      gender
      images {
        id
        optimised
      }
      totalTheftSuccess
      totalRecoveredValue
      totalIncidents
      totalValue
    }
    vehicles {
      id
      reference
      make
      model
      updatedAt
      colour
      registration
      totalOffenders
      totalIncidents
      totalCrimeGroups
    }
    incidents {
      id
      subject
      dayTime
      createdBy {
        id
        businesses {
          id
          name
        }
      }
      value
      recoveredValue
      reference
      policeRef
    }
    updates(orderBy: { createdAt: desc }) {
      id
      text
      type
      createdAt
      images {
        id
        url
        optimised
        card
      }
      linkedCrimeGroups {
        totalOffenders
        totalIncidents
        alias
        id
        reference
        totalRecoveredValue
        totalTheftSuccess
        totalValue
        updatedAt
      }
      linkedVehicles {
        updatedAt
        totalOffenders
        registration
        reference
        model
        make
        id
        colour
        images {
          id
          url
          optimised
        }
      }
      linkedIncidents {
        id
        subject
        description
        dayTime
        images {
          id
          url
          optimised
        }
      }
      linkedOffenders {
        id
        updatedAt
        age
        build
        dateOfBirth
        name
        race
        gender
        images {
          id
          url
          optimised
        }
      }
      createdBy {
        id
        fullName
        businesses {
          id
          name
        }
      }
      replies {
        id
        text
        type
        createdAt
        images {
          id
          url
          optimised
          card
        }
        linkedCrimeGroups {
          totalOffenders
          totalIncidents
          alias
          id
          reference
          totalRecoveredValue
          totalTheftSuccess
          totalValue
          updatedAt
        }
        linkedVehicles {
          updatedAt
          totalOffenders
          registration
          reference
          model
          make
          id
          colour
          images {
            id
            url
            optimised
          }
        }
        linkedIncidents {
          id
          subject
          description
          dayTime
          images {
            id
            url
            optimised
          }
        }
        linkedOffenders {
          id
          updatedAt
          age
          build
          dateOfBirth
          name
          race
          gender
          images {
            id
            url
            optimised
          }
        }
        createdBy {
          id
          fullName
          businesses {
            id
            name
          }
        }
      }
    }
  }
}
