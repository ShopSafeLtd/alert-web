mutation UpdateOffenderCrimeGroups(
  $id: String!
  $crimeGroups: NullableConnectArrayHelper
) {
  updateOffender(where: { id: $id }, data: { crimeGroups: $crimeGroups }) {
    id
    crimeGroups {
      id
      reference
      alias
      totalIncidents
      totalOffenders
      totalRecoveredValue
      totalTheftSuccess
      totalValue
    }
  }
}
