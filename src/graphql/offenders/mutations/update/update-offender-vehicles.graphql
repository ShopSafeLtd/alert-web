mutation UpdateOffenderVehicles(
  $id: String!
  $vehicles: VehicleUpdateManyWithoutOffenderNestedInput
) {
  updateOffender(where: { id: $id }, data: { vehicles: $vehicles }) {
    id
    vehicles {
      id
      reference
      colour
      model
      make
      registration
      images(take: 1) {
        id
        url
        position
        rotation
        policeImage
        primary
        optimised
      }
    }
  }
}
