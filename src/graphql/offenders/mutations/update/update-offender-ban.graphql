mutation UpdateOffenderBans($id: String!, $bans: BansOnOffenderUpdate) {
  updateOffender(where: { id: $id }, data: { bans: $bans }) {
    id
    bans(orderBy: { endDate: asc }) {
      id
      startDate
      endDate
      location
      description
      title
      months
      fineValue
      type
      duration
    }
  }
}
