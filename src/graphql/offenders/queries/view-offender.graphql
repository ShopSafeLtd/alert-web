query ViewOffender($where: OffenderWhereUniqueInput!) {
  offender(where: $where) {
    id
    createdAt
    updatedAt
    age
    build
    dateOfBirth
    dateSource
    hair
    gender
    name
    race
    peculiarities
    subscribed
    approved
    active
    images {
      id
      url
      optimised
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    bans {
      id
      title
      location
      description
      startDate
      endDate
    }
    createdBy {
      id
      fullName
      organisation
    }
    incidents {
      id
      dayTime
      date
      crimeTypes {
        id
        name
      }
      createdBy {
        id
        organisation
      }
    }
    updates(orderBy: { createdAt: desc }) {
      id
      text
      type
      createdAt
      images {
        id
        url
        optimised
        card
      }
      linkedIncidents {
        id
        subject
        description
        dayTime
        images {
          id
          url
          optimised
        }
      }
      linkedOffenders {
        id
        updatedAt
        age
        build
        dateOfBirth
        name
        race
        gender
        images {
          id
          url
          optimised
        }
      }
      createdBy {
        id
        fullName
        organisation
      }
      replies {
        id
        text
        type
        createdAt
        images {
          id
          url
          optimised
          card
        }
        linkedIncidents {
          id
          subject
          description
          dayTime
          images {
            id
            url
            optimised
          }
        }
        linkedOffenders {
          id
          updatedAt
          age
          build
          dateOfBirth
          name
          race
          gender
          images {
            id
            url
            optimised
          }
        }
        createdBy {
          id
          fullName
          organisation
        }
      }
    }
  }
}
