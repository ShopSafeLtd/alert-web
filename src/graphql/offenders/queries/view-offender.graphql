query ViewOffender(
  $where: OffenderWhereUniqueInput!
  $banWhere: BanWhereInput
) {
  offender(where: $where) {
    id
    alias
    createdAt
    scheme {
      mg11Available
    }
    updatedAt
    justification
    infoSource
    origOffenderId
    knownFor
    targetedGoods
    age
    build
    height
    dateOfBirth
    dateSource
    hair
    gender
    comment
    name
    reference
    race
    peculiarities
    subscribed
    approved
    active
    idVerified
    idSource
    totalImages
    totalIncidents
    incidents {
      id
      business {
        id
        name
      }
      dayTime
      policeNo
      policeRef
      reference
      subject
      totalRecoveredValue
      totalValue
      location {
        id
        full
        geoLat
        geoLng
      }
    }
    customGalleries {
      id
      name
    }
    images {
      ...Images
      faces {
        id
        confidence
        boundingHeight
        boundingLeft
        boundingTop
        boundingWidth
        offender {
          id
          name
        }
        rekMatchedSearches {
          id
        }
      }
    }
    addresses {
      ...Locations
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    bans(orderBy: { startDate: desc }, where: $banWhere) {
      id
      title
      location
      description
      startDate
      endDate
      type
      months
      fineValue
      duration
    }
    createdBy {
      ...CreatedBy
    }
    images {
      ...Images
    }
    crimeGroups {
      ...CrimeGroups
    }
    vehicles {
      ...Vehicles
    }

    evidence {
      ...Documents
    }
    investigations {
      ...Investigations
    }
    updates(orderBy: { createdAt: desc }) {
      ...Updates
    }
    searchedMatches {
      id
    }
    updates(orderBy: { createdAt: desc }) {
      ...Updates
    }
  }
}
