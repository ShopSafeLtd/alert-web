query offenderFeed(
  $userId: String!
  $schemeId: String!
  $search: String
  $order: OffenderOrderByWithRelationInput
  $first: Int
  $cursor: String
  $active: Boolean
  $banned: Boolean
  $groups: [String]
  $tags: [String!]
  $ethnicity: [String]
  $sex: [String]
  $approved: Boolean
) {
  offenderFeed(
    userId: $userId
    schemeId: $schemeId
    search: $search
    order: $order
    first: $first
    after: $cursor
    active: $active
    banned: $banned
    groups: $groups
    tags: $tags
    ethnicity: $ethnicity
    sex: $sex
    approved: $approved
  ) {
    id
    createdAt
    updatedAt
    age
    build
    dateOfBirth
    dateSource
    gender
    hair
    name
    peculiarities
    race
    approved
    uploaded
    active
    images {
      id
      url
      optimised
      card
    }
    tags {
      id
      name
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    createdBy {
      id
      fullName
      organisation
    }
    incidents {
      id
      createdAt
      updatedAt
      subject
      description
      dayTime
      crimeTypes {
        id
        name
      }
      location {
        id
        full
      }
      createdBy {
        id
        fullName
        organisation
      }
      images {
        id
        url
        optimised
        card
        offenders {
          id
        }
      }
      approved
      uploaded
    }
  }
}
