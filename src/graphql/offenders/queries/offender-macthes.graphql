query ViewOffenderMatches(
  $where: OffenderWhereUniqueInput!
  $orderBy: [RekMatchOrderByWithRelationInput!]
) {
  offender(where: $where) {
    id
    name
    reference
    age
    build
    height
    height
    gender
    race
    searchedMatches(orderBy: $orderBy) {
      id
      matchedFaces {
        id
        similarity
        rekFace {
          id
          boundingHeight
          boundingLeft
          boundingTop
          boundingWidth
          image {
            id
            url
            optimised
            position
            rotation
            faces {
              id
              confidence
              boundingHeight
              boundingLeft
              boundingTop
              boundingWidth
              offender {
                id
                name
                reference
                age
                gender
                race
                build
                height
                height
              }
              rekMatchedSearches {
                id
              }
            }
          }
        }
      }
      matchedOffender {
        id
        name
        reference
        age
        build
        height
        height
        gender
        race
        images {
          id
          position
          rotation
          optimised
        }
      }
    }
    images {
      id
      position
      rotation
      optimised
    }
  }
}
