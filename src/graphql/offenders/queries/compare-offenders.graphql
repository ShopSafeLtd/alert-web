query ViewOffendersCompare($where: OffenderWhereInput!) {
  offenders(where: $where) {
    id
    updatedAt
    age
    build
    height
    dateOfBirth
    dateSource
    hair
    gender
    name
    race
    peculiarities
    images {
      id
      optimised
      position
      rotation
    }
    tags {
      id
      name
    }
    lastActive {
      id
      dayTime
    }
  }
}
