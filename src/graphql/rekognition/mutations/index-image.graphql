mutation IndexImage($where: ImageWhereUniqueInput!) {
  indexImage(where: $where) {
    id
    url
    optimised
    position
    rotation
    faces {
      id
      confidence
      boundingHeight
      boundingLeft
      boundingTop
      boundingWidth
      offender {
        id
        name
      }
      rekMatchedSearches {
        id
      }
    }
  }
}
