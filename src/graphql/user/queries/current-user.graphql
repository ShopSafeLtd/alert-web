query currentUser {
  currentUser {
    id
    fullName
    origName
    email
    reference
    demId
    publicName
    businesses {
      id
      name
      demId
    }
    newUser
    groups {
      id
      name
      scheme {
        id
      }
    }
    schemes {
      id
      role
      scheme {
        logo {
          optimisedPersisted
        }
        darkLogo {
          optimisedPersisted
        }
        userTodos
        id
        name
        autoApproveIncidents
        autoApproveOffenders
        defaultPublicOffenderDOB
      }
    }
    incidentEmail
    incidentPush
    offenderEmail
    offenderPush
    messagePush
  }
}
