query currentUser {
  currentUser {
    id
    fullName
    email
    businesses {
      id
      name
    }
    newUser
    groups {
      id
      name
    }
    schemes {
      id
      role
      scheme {
        id
        name
        autoApproveIncidents
        autoApproveOffenders
      }
    }
    incidentEmail
    incidentPush
    offenderEmail
    offenderPush
    messagePush
  }
}
