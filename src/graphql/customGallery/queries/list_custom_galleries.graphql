query listCustomGalleries($where: CustomGalleryWhereInput, $take: Int, $skip: Int, $order: CustomGalleryOrderByWithRelationInput) {
  customGalleriesRelay(where: $where, take: $take, skip: $skip, order: $order) {
    edges {
      node {
         description
      id
      name
      }
    }
    totalCount
  }
}
