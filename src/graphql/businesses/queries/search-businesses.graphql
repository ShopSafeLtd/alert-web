query SearchBusinesses(
  $where: BusinessWhereInput
  $skip: Int
  $take: Int
  $orderBy: [BusinessOrderBy!]
) {
  listBusinesses(where: $where, skip: $skip, take: $take, orderBy: $orderBy) {
    total
    businesses {
      id
      name
      fullName
      publicName
      currency

      siteNumber
      locations {
        id
        full
      }
    }
  }
}
