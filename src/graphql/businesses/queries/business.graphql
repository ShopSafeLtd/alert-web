query Business(
  $where: BusinessWhereUniqueInput!
  $incidentsWhere: IncidentWhereInput
) {
  business(where: $where) {
    id
    name
    fullName
    publicName
    demId
    siteNumber
    brands
    policeArea
    currency
    brandsList {
      id
      name
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    incidents(where: $incidentsWhere) {
      id
      reference
      dayTime
      date
      subject
      policeRef
      totalValue
      totalRecoveredValue
      offenders {
        id
        name
        reference
        images (take: 1) {
          id
          url
        }
      }
      location {
        ...Locations
      }
    }
    todos {
      ...Todos
    }
    demDevices {
      ...DemDevices
      evidence {
        id
        name
        url
        fileType
      }
      demGroups {
        id
        name
      }
    }
    pttGroupId
    parent {
      id
      name
      fullName
    }
    evidences {
      id
      name
      url
      fileType
    }
    locations {
      id
      full
      geoLat
      geoLng
      county
    }
  }
}
