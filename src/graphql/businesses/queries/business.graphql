query Business(
  $where: BusinessWhereUniqueInput!
  $incidentsWhere: IncidentWhereInput
) {
  business(where: $where) {
    id
    name
    fullName
    publicName
    demId
    siteNumber
    brands
    brandsList {
      id
      name
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    incidents(where: $incidentsWhere) {
      id
      reference
      dayTime
      date
      crimeTypes {
        id
        name
      }
      createdBy {
        id
        businesses {
          id
          name
          fullName
        }
      }
      location {
        ...Locations
      }
    }
    todos {
      ...Todos
    }
    demDevices {
      ...DemDevices
      evidence {
        id
        name
        url
        fileType
      }
      demGroups {
        id
        name
      }
    }
    parent {
      id
      name
      fullName
    }
    evidences {
      id
      name
      url
      fileType
    }
    locations {
      id
      full
      geoLat
      geoLng
    }
  }
}
