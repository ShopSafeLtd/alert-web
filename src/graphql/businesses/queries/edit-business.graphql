query EditBusiness($where: BusinessWhereUniqueInput!) {
  business(where: $where) {
    id
    name
    fullName
    publicName
    siteNumber
    currency
    parent {
      id
      name
      fullName
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    brands
    policeArea
    locations {
      id
      building
      street
      townCity
      county
      postcode
      geoLng
      geoLat
    }
  }
}
