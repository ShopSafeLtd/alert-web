query ListBusinesses(
  $where: BusinessWhereInput
  $skip: Int
  $take: Int
  $orderBy: [BusinessOrderBy!]
) {
  listBusinesses(where: $where, skip: $skip, take: $take, orderBy: $orderBy) {
    total
    businesses {
      id
      name
      siteNumber
      fullName
      publicName
      policeArea
      demId
      parent {
        id
        name
      }
      locations {
        id
        full
      }
      groups {
        id
        name
      }
      tags {
        id
        name
      }
      totalUsers
    }
  }
}
