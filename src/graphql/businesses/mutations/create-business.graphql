mutation CreateBusiness($data: CreateBusinessDataInput!) {
  createBusiness(data: $data) {
    id
    name
    fullName
    publicName
    policeArea
    siteNumber
    demId
    parent {
      id
      name
    }
    locations {
      id
      full
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    totalUsers
  }
}
