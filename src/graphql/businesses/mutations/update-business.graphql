mutation UpdateBusiness(
  $data: BusinessUpdateInput!
  $where: BusinessWhereUniqueInput!
) {
  updateBusiness(data: $data, where: $where) {
    id
    name
    siteNumber
    fullName
    publicName
    demId
    parent {
      id
      name
      fullName
      publicName
    }
    locations {
      id
      building
      street
      townCity
      county
      postcode
      geoLng
      geoLat
    }
    groups {
      id
      name
    }
    tags {
      id
      name
    }
    totalUsers
  }
}
