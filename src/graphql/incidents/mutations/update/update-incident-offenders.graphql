mutation UpdateIncidentOffenders(
  $id: String!
  $offenders: OffenderUpdateManyWithoutIncidentsNested
) {
  updateIncident(where: { id: $id }, data: { offenders: $offenders }) {
    id
    offenders(where: { recycled: { equals: false } }) {
      ...Offenders
      images(take: 1) {
        ...Images
        offenders {
          id
          name
        }
      }
      recycled
    }
  }
}
