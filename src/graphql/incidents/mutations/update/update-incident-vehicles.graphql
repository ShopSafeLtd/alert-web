mutation UpdateIncidentVehicles(
  $id: String!
  $vehicles: VehicleUpdateManyWithoutIncidentsInput
) {
  updateIncident(where: { id: $id }, data: { vehicles: $vehicles }) {
    id
    vehicles {
      id
      reference
      colour
      model
      make
      registration
      images(first: 1) {
        ...Images
      }
    }
  }
}
