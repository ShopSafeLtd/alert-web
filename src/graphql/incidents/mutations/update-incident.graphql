mutation updateIncident($where: UniqueId!, $data: IncidentUpdateInput!) {
  updateIncident(where: $where, data: $data) {
    id
    subject
    description
    dayTime
    date
    time
    value
    recoveredValue
    policeReported
    policeRef
    policeInvolved
    subscribed
    priority
    customerRef
    crimeTypes {
      id
      name
    }
    approved
    location {
      ...Locations
    }
    createdBy {
      id
      fullName
      businesses {
        fullName
        id
        name
      }
    }
    images {
      id
      optimised
      position
      rotation
      url
      card
    }
    groups {
      id
      name
    }
    offenders {
      ...Offenders
      images {
        ...SimpleImages
      }
      tags {
        id
        name
      }
    }
  }
}
