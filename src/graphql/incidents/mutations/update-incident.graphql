mutation updateIncident($where: UniqueId!, $data: IncidentUpdateInput!) {
  updateIncident(where: $where, data: $data) {
    id
    subject
    business {
      id
      name
    }
    answers(orderBy: { tagQuestion: { priority: desc } }) {
      id
      answer
      tagQuestion {
        id
        priority
        dependentQuestions
        question {
          id
          question
        }
      }
      type
    }
    description
    dayTime
    date
    time
    value
    recoveredValue
    policeReported
    policeRef
    policeInvolved
    activityAuthorised
    subscribed
    priority
    customerRef
    crimeTypes {
      id
      name
    }
    approved
    location {
      ...Locations
    }
    createdBy {
      id
      fullName
      businesses {
        fullName
        id
        name
      }
    }
    images {
      id
      optimised
      position
      rotation
      url
      card
    }
    groups {
      id
      name
    }
    offenders {
      ...Offenders
      images {
        ...SimpleImages
        isFace
      }
      tags {
        id
        name
      }
    }
  }
}
