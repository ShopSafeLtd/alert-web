query ViewIncident($where: IncidentWhereUniqueInput!) {
  incident(where: $where) {
    id
    subject
    description
    dayTime
    date
    time
    crimeTypes {
      id
      name
    }
    approved
    offenders {
      id
      age
      build
      dateOfBirth
      gender
      name
      race
      approved
      images {
        id
        optimised
      }
    }
    location {
      id
      building
      street
      townCity
      county
      postcode
      full
    }
    createdBy {
      id
      fullName
      organisation
    }
    images {
      id
      optimised
      url
    }
    groups {
      id
      name
    }
  }
}
