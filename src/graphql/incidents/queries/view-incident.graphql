query ViewIncident($where: IncidentWhereUniqueInput!) {
  incident(where: $where) {
    id
    subject
    totalImages
    description
    dayTime
    date
    time
    reference
    ref
    policeReported
    policeRef
    policeNo
    policeInvolved
    subscribed
    totalValue
    totalRecoveredValue
    answers {
      id
      answer
      tagQuestion {
        id
        priority
        question {
          id
          question
        }
      }
      type
    }
    scheme {
      mg11Available
      restrictIncidentAccess
    }
    crimeTypes {
      id
      name
      crimeType
    }
    involvedTags {
      id
      name
    }
    impactTags {
      id
      name
    }
    incidentItems {
      id
      name
      value
      recoveredValue
      sku
      quantity
      recoveredQuantity
      goodsType {
        id
      }
    }
    approved
    business {
      id
      name
    }

    groups {
      id
      name
    }
    createdBy {
      ...CreatedBy
    }
    images {
      ...Images
    }
    crimeGroups {
      ...CrimeGroups
    }
    vehicles {
      ...Vehicles
      images {
        ...Images
      }
    }
    todos {
      ...Todos
    }
    offenders {
      ...Offenders
      images {
        ...Images
      }
    }
    evidence {
      ...Documents
    }
    investigations {
      ...Investigations
    }
    updates(orderBy: { createdAt: desc }) {
      ...Updates
    }
    location {
      ...Locations
    }
  }
}
