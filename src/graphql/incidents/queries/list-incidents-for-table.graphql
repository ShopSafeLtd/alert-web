query listIncidentsForTable(
  $scheme: SchemeWhereUniqueInput!
  $where: IncidentWhereInput
  $order: IncidentOrderByWithRelationInput
  $take: Int
  $skip: Int
) {
  listIncidents(
    scheme: $scheme
    where: $where
    order: $order
    take: $take
    skip: $skip
  ) {
    incidents {
      id
      subject
      dayTime
      reference
      policeRef
      business {
        id
        name
      }
      location {
        id
        full
      }
      incidentItems {
        value
        recoveredValue
      }
      offenders {
        id
        name
        images(take: 1) {
          id
          optimised
        }
      }
    }
    total
  }
}
