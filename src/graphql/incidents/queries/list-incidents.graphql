query listIncidents(
  $scheme: SchemeWhereUniqueInput!
  $where: IncidentWhereInput
  $order: IncidentOrderByWithRelationInput
  $take: Int
  $skip: Int
) {
  listIncidents(
    scheme: $scheme
    where: $where
    order: $order
    take: $take
    skip: $skip
  ) {
    incidents {
      id
      subject
      description
      dayTime
      crimeTypes {
        id
        name
      }
      approved
      location {
        id
        full
      }
      createdBy {
        id
        fullName
        organisation
      }
      images {
        id
        optimised
        url
      }
      groups {
        id
        name
      }
      offenders {
        id
        createdAt
        updatedAt
        age
        build
        dateOfBirth
        dateSource
        gender
        hair
        name
        peculiarities
        race
        approved
        uploaded
        active
        images {
          id
          url
          optimised
          card
        }
        tags {
          id
          name
        }
      }
    }
    total
  }
}
