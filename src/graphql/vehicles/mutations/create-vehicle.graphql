mutation CreateVehicle($data: CreateVehicleDataInput!) {
  createVehicle(data: $data) {
    id
    make
    model
    registration
    totalOffenders
    totalIncidents
    totalCrimeGroups
    reference
    images {
      id
      optimised
      url
      position
      rotation
    }
    incidents {
      id
      subject
    }
    offenders {
      id
      name
    }
    updatedAt
    colour
    crimeGroup {
      id
      reference
    }
    customGalleries {
      id
      name
    }
  }
}
