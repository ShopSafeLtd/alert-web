query listInvestigationsAllSchemes(
  $take: Int
  $skip: Int
  $where: InvestigationWhereInput
) {
  listInvestigationsAllSchemes(where: $where, take: $take, skip: $skip) {
    total
    investigations {
      id
      name
      description
      status
      createdAt
      closedAt
      reference
      groups {
        id
        name
      }
    }
  }
}
