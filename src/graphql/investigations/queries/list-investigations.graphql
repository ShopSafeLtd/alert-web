query listInvestigations(
  $scheme: SchemeWhereUniqueInput!
  $take: Int
  $skip: Int
  $where: InvestigationWhereInput
) {
  listInvestigations(scheme: $scheme, where: $where, take: $take, skip: $skip) {
    total
    investigations {
      id
      name
      description
      status
    }
  }
}
