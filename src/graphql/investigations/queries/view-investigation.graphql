query ViewInvestigation($where: InvestigationWhereUniqueInput!) {
    investigation(where: $where) {
        id
        description
        name
        createdBy {
            id
            fullName
        }
        vehicles {
            id
            make
            model
            colour
            registration
          updatedAt
          totalCrimeGroups
            totalOffenders
            totalIncidents
        }
        offenders {
            id
            name
            reference
            totalIncidents
            images{
                id
                optimised
            }
        }
        incidents {
            id
            policeRef
            dayTime
            createdBy {
                organisation
            }
            reference
            subject
            date
            location {
                id

            }
            value
            recoveredValue
        }
        crimeGroups {
            id
            alias
            reference

        }
        flows {
            updatedAt
        name
            id
        description
            edges{
                id
                type
                markerEnd
                source
                sourceHandle
                target
                targetHandle
            }
            nodes{
                id
                type
                data
                height
                width
                style {
                    height
                    width
                }
                position {
                    x
                    y
                }
                positionAbsolute {
                    x
                    y
                }
            }
        }
    }
    }