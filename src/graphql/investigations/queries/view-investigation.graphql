query ViewInvestigation($where: InvestigationWhereUniqueInput!) {
    investigation(where: $where) {
        id
        description
        name
        createdBy {
            id
            fullName
        }
        subscribed
        vehicles {
            id
            make
            model
            colour
            registration
          updatedAt
          totalCrimeGroups
            totalOffenders
            totalIncidents
        }
        updates(orderBy: { createdAt: desc }) {
            id
            text
            type
            createdAt
            images {
                id
                url
                optimised
                card
            }
            linkedIncidents {
                id
                subject
                description
                dayTime
                images {
                    id
                    url
                    optimised
                }
            }
            linkedOffenders {
                id
                updatedAt
                age
                build
                dateOfBirth
                name
                race
                gender
                images {
                    id
                    url
                    optimised
                }
            }
            createdBy {
                id
                fullName
                businesses {
                    id
                    name
                }
            }
            replies {
                id
                text
                type
                createdAt
                images {
                    id
                    url
                    optimised
                    card
                }
                linkedIncidents {
                    id
                    subject
                    description
                    dayTime
                    images {
                        id
                        url
                        optimised
                    }
                }
                linkedOffenders {
                    id
                    updatedAt
                    age
                    build
                    dateOfBirth
                    name
                    race
                    gender
                    images {
                        id
                        url
                        optimised
                    }
                }
                createdBy {
                    id
                    fullName
                    businesses {
                        id
                        name
                    }
                }
            }
        }

        offenders {
            id
            name
            reference
            totalIncidents
            images{
                id
                optimised
            }
        }
        incidents {
            id
            policeRef
            dayTime
            createdBy {
                organisation
            }
            reference
            subject
            date
            location {
                id

            }
            value
            recoveredValue
        }
        crimeGroups {
            id
            alias
            reference

        }
        flows {
            updatedAt
        name
            id
        description
            edges{
                id
                type
                markerEnd
                source
                sourceHandle
                target
                targetHandle
            }
            nodes{
                id
                type
                data
                height
                width
                style {
                    height
                    width
                }
                position {
                    x
                    y
                }
                positionAbsolute {
                    x
                    y
                }
            }
        }
    }
    }