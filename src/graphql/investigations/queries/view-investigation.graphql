query ViewInvestigation($where: InvestigationWhereUniqueInput!) {
  investigation(where: $where) {
    id
    description
    name
    status
    totalOffenders
    totalIncidents
    totalValue
    totalRecoveredValue
    totalTheftSuccess
    createdBy {
      id
      fullName
    }
    documents {
      id
      name
      url
      thumbnailUrl
      tags {
        name
        id
      }
    }
    subscribed
    todos {
      id
      name
      description
      dueDate
      completed
      assignedUsers {
        id
        fullName
      }
    }
    vehicles {
      id
      make
      model
      colour
      registration
      updatedAt
      totalCrimeGroups
      totalOffenders
      totalIncidents
      reference
    }
    updates(orderBy: { createdAt: desc }) {
      id
      text
      type
      createdAt
      images {
        id
        url
        optimised
        optimisedPersisted
        card
        position
        rotation
      }
      linkedCrimeGroups {
        totalOffenders
        totalIncidents
        alias
        id
        reference
        totalRecoveredValue
        totalTheftSuccess
        totalValue
        updatedAt
      }
      linkedVehicles {
        images {
          id
          url
          optimised
          optimisedPersisted
          position
          rotation
        }
        updatedAt
        totalOffenders
        registration
        reference
        model
        make
        id
        colour
      }
      linkedIncidents {
        id
        subject
        description
        dayTime
        images {
          id
          url
          optimised
          optimisedPersisted
          position
          rotation
        }
      }
      linkedOffenders {
        id
        updatedAt
        age
        build
        height
        dateOfBirth
        name
        race
        gender
        images {
          id
          url
          optimised
          optimisedPersisted
          position
          rotation
        }
      }
      createdBy {
        origName
        id
        fullName
        businesses {
          id
          name
          fullName
        }
      }
      replies {
        id
        text
        type
        createdAt
        images {
          id
          url
          optimisedPersisted
          optimised
          card
          position
          rotation
        }
        linkedCrimeGroups {
          totalOffenders
          totalIncidents
          alias
          id
          reference
          totalRecoveredValue
          totalTheftSuccess
          totalValue
          updatedAt
        }
        linkedVehicles {
          images {
            id
            url
            optimisedPersisted
            optimised
            position
            rotation
          }
          updatedAt
          totalOffenders
          registration
          reference
          model
          make
          id
          colour
        }
        linkedIncidents {
          id
          subject
          description
          dayTime
          images {
            id
            url
            optimised
            position
            rotation
          }
        }
        linkedOffenders {
          id
          updatedAt
          age
          build
          height
          dateOfBirth
          name
          race
          gender
          images {
            id
            url
            optimised
            optimisedPersisted
            position
            rotation
          }
        }
        createdBy {
          origName
          id
          fullName
          businesses {
            id
            name
            fullName
          }
        }
      }
    }
    offenders {
      id
      name
      reference
      totalIncidents
      age
      gender
      race
      build
      height
      dateOfBirth
      images {
        id
        optimised
        optimisedPersisted
        position
        rotation
      }
    }
    incidents {
      id
      policeRef
      dayTime
      createdBy {
        organisation
      }
      reference
      subject
      date
      location {
        id
        full
        geoLat
        geoLng
      }
      totalValue
      totalRecoveredValue
    }
    crimeGroups {
      id
      alias
      reference
      offenders {
        id
        name
        reference
        totalIncidents
        age
        gender
        race
        build
        height
        dateOfBirth
        images {
          id
          optimised
          optimisedPersisted
          position
          rotation
        }
      }
      vehicles {
        id
        make
        model
        colour
        registration
        updatedAt
        reference
      }
    }
    flows {
      updatedAt
      name
      id
      description
      edges {
        id
        type
        markerEnd
        source
        sourceHandle
        target
        targetHandle
      }
      nodes {
        id
        type
        data
        height
        width
        style {
          height
          width
        }
        position {
          x
          y
        }
        positionAbsolute {
          x
          y
        }
      }
    }
  }
}
