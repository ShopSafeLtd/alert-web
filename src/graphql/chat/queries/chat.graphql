query Chat($where: ChatWhereUniqueInput!) {
  chat(where: $where) {
    id
    name
    description
    totalMembers
totalMessages
    members {
      id
      user {
        id
        fullName
        firstLetter
        origFirstLetter
        origName
        businesses {
          fullName
          id
          name
        }
      }
    }
  }
}
