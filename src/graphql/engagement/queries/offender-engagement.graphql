query OffenderEngagement($offenderId: String!) {
  offenderEngagement(offenderId: $offenderId) {
    offenderId
    offenderName
    totalViews
    totalUsers
    viewedCount
    notViewedCount
    viewRate
    averageViewsPerUser
    users {
      userId
      userFullName
      userEmail
      hasViewed
      firstViewedAt
      lastViewedAt
      viewCount
    }
  }
}
