mutation UpdateTodoMention($where: UpdateTodoMention!) {
  updateTodoMention(where: $where) {
    description
    dueDate
    completedDate
    completed
    id
    name
    createdBy {
      id
      fullName
    }
    completedBy {
      id
      fullName
    }
    assignedUsers {
      id
      fullName
    }
  }
}
