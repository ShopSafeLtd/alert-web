mutation CreateTodo($data: TodoCreateInput!) {
  createTodo(data: $data) {
    type
    description
    dueDate
    createdAt
    completedDate
    completed
    id
    name
    similarOffenderIds
    createdBy {
      id
      fullName
    }
    assignedUsers {
      id
      fullName
    }
    groups {
      id
      name
    }
  }
}
