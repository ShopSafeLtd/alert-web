mutation UpdateTodo($data: TodoUpdateInput!, $where: UniqueId!) {
  updateTodo(data: $data, where: $where) {
    description
    dueDate
    completedDate
    completed
    id
    name
    createdBy {
      id
      fullName
    }
    completedBy {
      id
      fullName
    }
    assignedUsers {
      id
      fullName
    }
  }
}
