query aiVisionEvents($where: AiVisionEventWhereInput!, $orderBy: [AiVisionEventOrderByInput!], $take: Int, $skip: Int) {
    aiVisionEvents(where: $where, orderBy: $orderBy, take: $take, skip: $skip) {
        edges {
            node {
                id
                business {
                    id
                    name
                }
                camera {
                    id
                    serialNumber
                }
                createdAt
                matchFound
                type
            }
        }
        totalCount
    }
}
