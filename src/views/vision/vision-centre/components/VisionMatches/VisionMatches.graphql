query AiVisionMatches($where: AiVisionMatchWhereInput!, $orderBy: [AiVisionMatchOrderByInput!], $take: Int) {
    aiVisionMatches(where: $where, orderBy: $orderBy, take: $take) {
        edges {
            node {
                id
                priority
                business {
                    id
                    name
                }
                camera {
                    id
                    serialNumber
                }
                matchedOffender {
                    id
                    reference
                    name
                    aiSummary
                    tags {
                        id
                        name
                    }
                    images (take: 1) {
                        id
                        url
                    }
                }
                faceImage {
                    id
                    url
                }
                stillImage {
                    id
                    url
                }
                confidenceRating
                confidence
                priority
                createdAt
            }
        }
    }
}