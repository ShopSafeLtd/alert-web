query DashboardTemplates(
  $scheme: SchemeWhereUniqueInput!
  $after: String
  $first: Int
  $last: Int
  $roles: [String!]
  $skip: Int
  $take: Int
) {
  dashboards(
    scheme: $scheme
    after: $after
    first: $first
    last: $last
    roles: $roles
    skip: $skip
    take: $take
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
      defaultAdmin
      defaultUser
        id
        name
        scheme {
          id
          name
        }
        roles {
          id
          name
        }
      }
    }
    totalCount
  }
}
