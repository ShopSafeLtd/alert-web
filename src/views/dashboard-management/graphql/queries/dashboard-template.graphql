query DashboardTemplate($where: DashboardWhereUniqueInput!) {
  dashboard(where: $where) {
    id
    runningBanner
    layout {
      h
      i
      id
      maxH
      maxW
      minH
      minW
      moved
      static
      w
      x
      y
      metadata
    }
    name
    roles {
      id
      name
    }
  }
}
