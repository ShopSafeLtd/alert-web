query WorkflowData(
  $where: SchemeWhereUniqueInput!
  $questionsWhere: QuestionWhereInput
  $schemeTagsWhere: TagWhereInput
) {
  scheme(where: $where) {
    questions(where: $questionsWhere) {
      id
      questionOn
      optionsFormFormatted {
        value
        label
      }
      type
      questionFormatted
    }
    schemeTags(where: $schemeTagsWhere) {
      id
      name
    }
    groups {
      id
      name
    }
  }
}
