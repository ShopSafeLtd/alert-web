#import "../../../../../graphql/fragments/updates.graphql"

query stockRemovalRequest($where: UniqueId!) {
    stockRemovalRequest (where: $where) {
        id
        createdAt
        title
        description
        status
        reference
        costCentreCode
        destination
        nominalCode
        fascia
        picker {
            id
            fullName
        }
        priority
        personalityInfluences
        reason
        reasonForNonReturn
        rechargeBrand
        rechargeReference
        recipientEmail
        recipientName
        recipientPhone
        returnDate
        shippingAddress
        shippingAddressLine1
        shippingAddressLine2
        shippingCity
        shippingCounty
        shippingPostcode
        shippingCountry
        smqAccountNumber
        socialHandles
        storeOrDC
        willStockBeReturned
        tmid
        tracking
        createdBy {
            id
            fullName
        }
        items {
            id
            name
            brand
            sku
            barcode
            pickLocation
            requestedQuantity
            pickedQuantity
            value
        }
        business {
            id
            name
        }
        approvers {
            status
            id
            user {
                id
                fullName
            }
        }
        updates(orderBy: { createdAt: desc }) {
            ...Updates
        }
    }
}