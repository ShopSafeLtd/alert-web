query IncidentsFeed(
  $order: IncidentOrderByWithRelationInput
  $search: String
  $first: Int
  $after: String
  $crimeTypes: [String!]
  $groups: [String]
  $schemeId: String!
) {
  incidentsRelay(
    order: $order
    first: $first
    after: $after
    search: $search
    crimeTypes: $crimeTypes
    groups: $groups
    schemeId: $schemeId
  ) {
    edges {
      node {
        ...IncidentCard
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
