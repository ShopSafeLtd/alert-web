query IncidentsFeed(
  $order: IncidentOrderByWithRelationInput
  $search: String
  $first: Int
  $after: String
  $where: IncidentWhereInput
  $schemeId: String!
  $approved: Boolean
) {
  incidentsRelay(
    order: $order
    first: $first
    after: $after
    search: $search
    where: $where
    schemeId: $schemeId
    approved: $approved
  ) {
    edges {
      node {
        ...IncidentCard
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
