query QuestionGroupOnScheme($where: SchemeWhereUniqueInput!, $questionGroupsWhere: QuestionGroupWhereInput) {
  scheme(where: $where) {
    questionGroups(where: $questionGroupsWhere) {
      id
      name
      description
      defaultDueDate
      questions {
        questionFormatted
        id
        optionsFormFormatted {
          label
          value
        }
        type
      }
    }
  }
}
