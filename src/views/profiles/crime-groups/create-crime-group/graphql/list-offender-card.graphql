query ListOffendersCard(
  $after: String
  $first: Int
  $order: OffenderOrderByWithRelationInput
  $scheme: SchemeWhereUniqueInput
  $where: OffenderWhereInput
  $orderByValue: SortOrder
) {
  listOffendersRelay(
    after: $after
    first: $first
    order: $order
    scheme: $scheme
    where: $where
    orderByValue: $orderByValue
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...Offenders
        lastActive {
          id
          dayTime
        }
        images {
          id
          url
          optimised
          card
          position
          rotation
        }
      }
    }
  }
}
