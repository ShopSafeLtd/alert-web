query OffenderAiDrawer($where: OffenderWhereUniqueInput!) {
    offender(where: $where) {
        aiBehavioralAnalysis {
            id
            interventionResponse
            learningBehavior
            planningEvidence
            riskTolerance
            sophisticationLevel
            stressResponse
            tacticsUsed
        }
        aiGeographicAnalysis {
            id
            geographicPattern
            hotspotAnalysis
            travelDistance
        }
        aiIdentityLinkage {
            distinctiveMarkers
            identityConfidence
            potentialMatches
        }
        aiImpactAssessment {
            category
            financialImpact
            id
            justification
            keyFactors
            overallScore
            securityResourceImpact
        }
        aiImpactScore
        aiImprovements
        aiKeyObservations
        aiMO
        aiMethods
        aiQualityAssessment {
            id
            dataGaps
            improvements
            qualityScore
        }
        aiQualityScore
        aiRecommendedActions {
            earlyWarningSignals
            id
            preventionTactics
            priorityLevel
            staffGuidance
        }
        aiRiskAssessment {
            confrontationResponse
            escalationPotential
            id
            reoffendingProbability
            staffSafetyRisk
            threatLevel
            violencePotential
        }
        aiSummary
        aiTargetAnalysis {
            id
            storeVulnerabilities
            targetPreference
            valueRange
        }
        aiTemporalAnalysis {
            frequencyAnalysis
            patternPrediction
            timePatterns
        }
    }
}