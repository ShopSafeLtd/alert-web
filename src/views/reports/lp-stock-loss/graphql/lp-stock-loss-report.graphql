query LpStockLossReport($startDate: DateTime, $endDate: DateTime, $schemeId: String, $goodsTypeId: String, $stockItemId: String, $businessId: String, $topItemsOrderBy: LPStockLossTopItemsOrderBy, $offenderOrderBy: LPStockLossOffenderOrderBy, $goodsTypeOrderBy: LPStockLossGoodsTypeOrderBy) {
  lpStockLossReport(startDate: $startDate, endDate: $endDate, schemeId: $schemeId, goodsTypeId: $goodsTypeId, stockItemId: $stockItemId, businessId: $businessId, topItemsOrderBy: $topItemsOrderBy, offenderOrderBy: $offenderOrderBy, goodsTypeOrderBy: $goodsTypeOrderBy) {
    summary {
      totalIncidents
      totalValueLost
      totalValueRecovered
      recoveryRate
      uniqueItemsStolen
      uniqueOffenders
      businessesAffected
      periodIncidentChange
      periodValueChange
    }
    topTargetedItems {
      stockItemId
      name
      brand
      goodsTypeName
      incidentCount
      totalValueLost
      totalValueRecovered
      netValueLost
      totalQuantityLost
      recoveryRate
      topBusinesses {
        id
        name
      }
    }
    goodsTypeBreakdown {
      goodsTypeId
      goodsTypeName
      totalValueLost
      totalValueRecovered
      netValueLost
      incidentCount
      recoveryRate
      topItems {
        name
        incidentCount
      }
      monthlyTrend {
        month
        count
      }
    }
    incidentAnalysis {
      approvalBreakdown {
        approved
        pending
      }
      byBusiness {
        id
        name
        incidentCount
        totalValueLost
      }
      byHour {
        hour
        count
      }
      byDayOfWeek {
        dayOfWeek
        count
      }
    }
    offenderAssociations {
      id
      name
      incidentCount
      itemsTargeted
      businessesTargeted
      totalValueAssociated
      totalValueRecovered
      netValueLost
    }
    recoveryAnalysis {
      overallRecoveryRate
      byGoodsType {
        id
        name
        recoveryRate
        totalValueLost
        totalValueRecovered
      }
      byBusiness {
        id
        name
        recoveryRate
        totalValueLost
        totalValueRecovered
      }
      zeroRecoveryItems {
        stockItemId
        name
        sku
        totalValueLost
      }
      highestAbsoluteRecoveryItems {
        stockItemId
        name
        sku
        totalValueLost
      }
    }
    businessHotspots {
      id
      name
      incidentCount
      totalValueLost
      recoveryRate
      topTargetedItems
    }
  }
}
