query IncidentItemsReport($where: IncidentItemsWhereInput!, $take: Int, $skip: Int, $orderby: IncidentItemsOrderByInput) {
    incidentItems(where: $where, take: $take, skip: $skip, orderby: $orderby) {
        edges {
            node {
                id
                name
                quantity
                recoveredQuantity
                incident {
                    id
                    date
                    createdAt
                    business {
                        id
                        name
                        siteNumber
                    }
                }
                sku
                stockItem {
                    goodsType {
                        id
                        name
                    }
                    variant
                }
            }
        }
        totalCount
    }
}
