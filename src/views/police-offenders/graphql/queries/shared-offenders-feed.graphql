#import "../../../../components/police-offenders/PoliceOffenderCard/PoliceOffenderCard.fragment.graphql"

query SharedOffendersFeed(
  $after: String
  $first: Int
  $orderBy: SharedOffenderRelayOrderInput
  $where: SharedOffenderRelayWhereInput
  $skip: Int
) {
  sharedOffenderRelay(
    after: $after
    first: $first
    orderBy: $orderBy
    where: $where
    skip: $skip
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      endCursor
      startCursor
    }
    edges {
      cursor
      node {
        ...PoliceOffenderCard
      }
    }
    totalCount
  }
}
