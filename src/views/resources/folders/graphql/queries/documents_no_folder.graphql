query documentsNoFolder(
  $skip: Int
  $take: Int
  $orderBy: [DocumentOrderByWithRelationInput!]
  $where: DocumentWhereInput
) {
  documentsNoFolder(
    skip: $skip
    take: $take
    orderBy: $orderBy
    where: $where
  ) {
    totalCount
    edges {
      node {
        ...FolderDocuments
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
