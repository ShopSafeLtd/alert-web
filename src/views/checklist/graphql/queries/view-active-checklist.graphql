query ActiveChecklist($where: ActiveChecklistWhereUniqueInput!) {
    activeChecklist(where: $where) {
        id
        name
        comments
        signature
        status
        completedAt
        percentageScore
        percentComplete
        completedBy {
            origName
        }
        business {
            name
        }
        scheme {
            checklistRequired
            logo {
                urlPersisted
            }
        }
        fields {
            id
            question
            type
            availableAnswers
            dependent

            answer {
                answer
                additionalComments
                images
            }
            section
            subsection
            order
        }
        checklistSection {
            sub
            section
            subsection
            titleLocaled
            dependsOnWeight {
                weight
                dependsOn
            }
        }
    }
}
