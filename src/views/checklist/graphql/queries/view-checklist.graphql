query Checklist($where: ChecklistWhereUniqueInput!) {
  checklist(where: $where) {
    id
    title
    description
    sections {
      order
      title
      subsections {
        title
        order
        questions {
          order
          question
          type
          weight {
            weight
            answer
          }
        }
      }
    }
    users {
      id
    }
    business {
      id
    }
  }
}
