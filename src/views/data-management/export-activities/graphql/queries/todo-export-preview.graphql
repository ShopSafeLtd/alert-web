query TodoExportPreview(
  $where: TodoRelayWhereInput!
  $take: Int
  $orderBy: [TodoOrderByWithRelationInput!]
  $after: String
) {
  todoExportRelay(
    where: $where
    take: $take
    orderBy: $orderBy
    after: $after
  ) {
    edges {
      node {
        id
        name
        reference
        description
        dueDate
        completedDate
        completed
        createdAt
        type
        business {
          name
          id
        }
      }
    }
    totalCount
  }
}
