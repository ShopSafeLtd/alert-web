query Roles(
  $schemeId: String!
  $skip: Int
  $take: Int
  $after: String
  $first: Int
  $orderBy: CustomRoleOrderByWithRelationInput
) {
  roles(
    schemeId: $schemeId
    skip: $skip
    take: $take
    after: $after
    first: $first
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      node {
        id
        name
        type
        usersCount
        approvalTier
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
