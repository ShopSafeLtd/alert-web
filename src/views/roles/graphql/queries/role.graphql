query Role($where: CustomRoleWhereUniqueInput!) {
  role(where: $where) {
    id
    name
    usersCount
    approvalTier
    permissions {
      allowedMethods
      model
    }
    type
    folders {
      id
      name
      childFolders {
        id
        name
      }
    }
    checklists {
      id
      title
    }
    users {
      user {
        fullName
        id
        email
      }
    }
    parentId
  }
}
