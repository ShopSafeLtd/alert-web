#import "../../../../components/police-incidents/PoliceIncidentCard/PoliceIncidentCard.fragment.graphql"

query SharedIncidentsFeed(
  $after: String
  $first: Int
  $orderBy: SharedIncidentRelayOrderInput
  $where: SharedIncidentRelayWhereInput
  $skip: Int
) {
  sharedIncidentRelay(
    after: $after
    first: $first
    orderBy: $orderBy
    where: $where
    skip: $skip
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      endCursor
      startCursor
    }
    edges {
      cursor
      node {
        ...PoliceIncidentCard
      }
    }
    totalCount
  }
}
