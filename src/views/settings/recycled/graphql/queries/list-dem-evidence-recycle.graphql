query listDemEvidenceRecycle($skip: Int, $take: Int, $recycled: Boolean!) {
  listDemEvidenceRecycle(skip: $skip, take: $take, recycled: $recycled) {
    edges {
      node {
        type
        thumbnailUrl
        recordedAt
        playbackUrl
        id
        importance
        officerName
        duration
      }
    }
    totalCount
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
