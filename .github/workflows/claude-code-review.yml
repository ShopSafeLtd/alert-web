name: Claude Code Review (Claudius)
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string
      prompt:
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run investigation
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUG_PROMPT: ${{ inputs.prompt }}
        run: |
          claude --max-turns 20 -p "You are a senior engineer investigating a live support ticket bug.

          Bug description: ${BUG_PROMPT}

          Investigate: search for relevant files, read them, follow function calls. Do NOT modify any files.

          Structure your response exactly as:
          ## Root Cause
          One sentence.
          ## Relevant Files
          - path/to/file.ts (lines X-Y): why relevant
          ## Suggested Fix
          Specific code change or next step." > /tmp/analysis.txt 2>&1

      - name: Post result to Claudius
        if: always()
        run: |
          if [ -f /tmp/analysis.txt ] && [ -s /tmp/analysis.txt ]; then
            ANALYSIS=$(cat /tmp/analysis.txt)
          else
            ANALYSIS="Claude Code completed but produced no output."
          fi
          curl -sf -X POST "${{ secrets.CLAUDIUS_CALLBACK_URL }}/api/github/review-callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CLAUDIUS_CALLBACK_SECRET }}" \
            --max-time 15 \
            --data-raw "$(jq -n \
              --arg cid "${{ inputs.correlation_id }}" \
              --arg repo "${{ github.event.repository.name }}" \
              --arg analysis "$ANALYSIS" \
              '{correlation_id:$cid,repo:$repo,analysis:$analysis}')"
