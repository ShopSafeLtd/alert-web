overwrite: true
schema: "http://localhost:4000/graphql"
documents: "src/**/*.graphql"
generates:
  src/graphql/generated.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config: {
      addDocBlocks: false,
      useTypeImports: true,
      scalars: {
        DateTime: 'Date',
        JSON: '{ [key: string]: any }',      }
    }