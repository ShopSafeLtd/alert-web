overwrite: true
schema: 'http://localhost:4000/graphql'
documents: 'src/**/*.graphql'
config:
  addDocBlocks: false,
  scalars: { DateTime: 'Date', Date: 'Date', JSON: '{ [key: string]: any }' }
hooks:
  afterAllFileWrite:
    - prettier --write
generates:
  src/graphql/types.ts:
    plugins:
      - 'typescript'
  src/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.tsx
      baseTypesPath: graphql/types.ts
      baseTypes: types
    plugins:
      - 'typescript-operations'
      - 'typescript-react-apollo'
    config:
      {
        withHooks: true,
        addDocBlocks: false,
        useTypeImports: true,
        scalars:
          { DateTime: 'Date', Date: 'Date', JSON: '{ [key: string]: any }' },
      }
